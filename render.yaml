services:
  - type: web
    name: rated-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    # preDeployCommand would be cleaner but is a paid-tier-only feature on
    # Render, so migrations run as the last build step instead - functionally
    # equivalent for our purposes (migrations still apply before the new
    # version starts serving traffic).
    #
    # Render sets NODE_ENV=production by default for Node web services,
    # which makes plain `npm install` skip devDependencies - breaking this
    # build, since typescript/@types/*/prisma (needed to compile and to run
    # migrate deploy) are devDependencies. --include=dev overrides that.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Paste your Neon connection string here (see README "Deploying" section).
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_SECONDS
        value: '900'
      - key: REFRESH_TOKEN_TTL_SECONDS
        value: '2592000'
      # Update these two if Render assigns different subdomains than the
      # service names below (e.g. because they were already taken).
      - key: APP_BASE_URL
        value: https://rated-web.onrender.com
      - key: SERVER_BASE_URL
        value: https://rated-server.onrender.com
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        value: https://rated-server.onrender.com/v1/connections/spotify/callback

  - type: web
    name: rated-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Update if the backend's actual assigned URL differs (see above).
      - key: VITE_API_BASE_URL
        value: https://rated-server.onrender.com/v1
